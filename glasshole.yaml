esphome:
  name: glasshole
  friendly_name: GlassHole Detector
  on_boot:
    priority: -100
    then:
      - repeat:
          count: 2
          then:
            - light.turn_on: glasshole_led
            - light.turn_on: board_led
            - delay: 250ms
            - light.turn_off: glasshole_led
            - light.turn_off: board_led
            - delay: 250ms

# Seeed Studio XIAO ESP32C5 - native USB-Serial/JTAG, 8MB flash.
# ESP32-C5 requires the ESP-IDF framework; Arduino is not supported on this variant.
esp32:
  board: seeed_xiao_esp32c5
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Time source required by the wireguard component, and used to timestamp detection log entries.
time:
  - platform: sntp
    id: sntp_time

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Glasshole Fallback Hotspot"
    password: !secret ap_fallback_password

captive_portal:

# Lets the device be provisioned with new/foreign Wi-Fi credentials over the USB
# serial connection (Improv Wi-Fi protocol), in addition to the AP hotspot above.
improv_serial:

# Reaches the Home Assistant / ESPHome API over a VPN tunnel when the device is not
# on the same LAN as the ESPHome dashboard/HA instance. Runs alongside normal LAN
# connectivity; require_connection_to_proceed defaults to false so boot never blocks
# on the tunnel coming up.
wireguard:
  id: glasshole_wireguard
  address: !secret wireguard_address
  private_key: !secret wireguard_private_key
  peer_endpoint: !secret wireguard_peer_endpoint
  peer_public_key: !secret wireguard_peer_public_key

# Scan parameters mirror the original glass-detect.ino (setInterval(100)/setWindow(80),
# which are in 0.625ms BLE units -> ~62.5ms interval / ~50ms window).
esp32_ble_tracker:
  scan_parameters:
    interval: 100ms
    window: 60ms
    active: true
  on_ble_advertise:
    then:
      - lambda: |-
          // Meta/Facebook MAC OUI prefixes seen on Ray-Ban Meta smart glasses.
          // Source: https://github.com/sh4d0wm45k/glass-detect - add more here as they surface.
          static const char *meta_prefixes[] = {
              "7c:2a:9e",
              "cc:66:0a",
              "f4:03:43",
              "5c:e9:1e",
          };

          std::string mac = x.address_str();
          std::transform(mac.begin(), mac.end(), mac.begin(), ::tolower);

          std::string name = x.get_name();

          bool prefix_match = false;
          for (auto prefix : meta_prefixes) {
            if (mac.rfind(prefix, 0) == 0) {
              prefix_match = true;
              break;
            }
          }

          bool name_match = name.find("Ray-Ban") != std::string::npos ||
                             name.find("Meta") != std::string::npos;

          if (prefix_match || name_match) {
            char log_line[160];
            time_t now = id(sntp_time).now().timestamp;
            snprintf(log_line, sizeof(log_line), "%lld mac=%s name=\"%s\" rssi=%d match=%s",
                     (long long) now, mac.c_str(), name.c_str(), x.get_rssi(),
                     prefix_match ? "mac_prefix" : "name");

            ESP_LOGW("glasshole", "Meta glasses detected: %s", log_line);
            id(glasshole_detected).publish_state(true);
            id(last_glasshole_mac).publish_state(mac);
            id(detection_log).publish_state(log_line);
            id(glasshole_flash).execute();
          }

binary_sensor:
  - platform: template
    name: "Meta Glasses Detected"
    id: glasshole_detected
    device_class: occupancy
    filters:
      - delayed_off: 10s
  - platform: template
    name: "WireGuard Connected"
    id: wireguard_connected
    device_class: connectivity
    lambda: return id(glasshole_wireguard).is_peer_up();

text_sensor:
  - platform: template
    name: "Last Detected Glasses MAC"
    id: last_glasshole_mac
  # Every published value is a distinct, timestamped detection record; Home Assistant's
  # logbook/history for this entity is the persistent log of each detection.
  - platform: template
    name: "Detection Log"
    id: detection_log

# External LED sign (the "GLASSHOLE" PCB from the original project). GPIO1 is the D0
# header pin on the XIAO ESP32C5 - rewire to taste if your sign driver uses a different pin.
output:
  - platform: gpio
    pin: GPIO1
    id: glasshole_led_output
  # Onboard user LED (GPIO27 on the XIAO ESP32C5) for feedback with no external wiring.
  - platform: gpio
    pin: GPIO27
    id: board_led_output

light:
  - platform: binary
    name: "GlassHole Sign"
    id: glasshole_led
    output: glasshole_led_output
  - platform: binary
    name: "Board LED"
    id: board_led
    output: board_led_output

script:
  - id: glasshole_flash
    mode: restart
    then:
      - repeat:
          count: 4
          then:
            - light.turn_on: glasshole_led
            - light.turn_on: board_led
            - delay: 500ms
            - light.turn_off: glasshole_led
            - light.turn_off: board_led
            - delay: 500ms
